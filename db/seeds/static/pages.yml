about:
  title: О гостинице
  body: |-
    Наша гостиница расположена в историческом центре города. К услугам гостей — уютные номера, ресторан с завтраками и спа-центр.

    Мы дорожим репутацией и делаем всё, чтобы ваш отдых был комфортным.
contacts:
  title: Контакты
  body: |-
    Адрес: г. Москва, ул. Примерная, д. 1
    Телефон: +7 (900) 000-00-00
    Email: hello@hotel.example

    Ресепшн работает круглосуточно.
privacy:
  title: Политика обработки персональных данных
  body: |-
    Обрабатывая ваши персональные данные (имя, телефон, электронная почта), мы используем их исключительно для бронирования номеров и связи с вами по вопросам проживания.

    Мы не передаём ваши данные третьим лицам и храним их в защищённой базе данных. Вы вправе запросить удаление ваших данных в любой момент, обратившись на ресепшн.